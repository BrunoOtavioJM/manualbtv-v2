<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manual BTC Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script>
        (function(){
            var t = localStorage.getItem('manualbtc-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--color-accent)"><path d="M14.5 10c.83 0 1.5-.67 1.5-1.5v-1c0-.83-.67-1.5-1.5-1.5H11V10h3.5zm.5 2.5H11V15h4c.83 0 1.5-.67 1.5-1.5 0-.83-.67-1.5-1.5-1.5zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            <h2>Manual<strong>BTC</strong> Admin</h2>
        </div>
        <h1>Acesso Administrativo</h1>
        <form id="login-form" class="admin-form">
            <div class="field-group">
                <label for="email" class="field-label">E-mail</label>
                <input type="email" id="email" class="field-input" autocomplete="email" required>
            </div>
            <div class="field-group">
                <label for="password" class="field-label">Senha</label>
                <input type="password" id="password" class="field-input" autocomplete="current-password" required>
            </div>
            <div class="field-group">
                <label>
                    <input type="checkbox" id="remember"> Manter conectado
                </label>
            </div>
            <button type="submit" class="btn-admin-primary" id="btn-login" style="width: 100%;">Entrar</button>
            <div id="login-error" class="login-error" style="display: none; color: #dc2626; margin-top: 1rem; font-size: 0.875rem;"></div>
            <div id="attempts-warning" class="login-attempts-warning" style="display: none; color: #f7931a; margin-top: 1rem; font-size: 0.875rem;"></div>
        </form>
    </div>

    <script type="module">
        import { auth } from '../assets/js/firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('login-error');
        const attemptsWarning = document.getElementById('attempts-warning');

        let attempts = parseInt(localStorage.getItem('login_attempts') || '0', 10);
        let blockTime = parseInt(localStorage.getItem('login_block_time') || '0', 10);

        function checkBlock() {
            if (blockTime && Date.now() < blockTime) {
                const remainingMinutes = Math.ceil((blockTime - Date.now()) / 60000);
                errorMsg.textContent = `Acesso bloqueado. Tente novamente em ${remainingMinutes} minutos.`;
                errorMsg.style.display = 'block';
                btnLogin.disabled = true;
                return true;
            } else if (blockTime && Date.now() >= blockTime) {
                localStorage.removeItem('login_attempts');
                localStorage.removeItem('login_block_time');
                attempts = 0;
                blockTime = 0;
                btnLogin.disabled = false;
                errorMsg.style.display = 'none';
                attemptsWarning.style.display = 'none';
            }
            return false;
        }

        checkBlock();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = '/admin/dashboard.html';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (checkBlock()) return;

            const email = emailInput.value;
            const password = passwordInput.value;
            const remember = rememberCheckbox.checked;

            btnLogin.disabled = true;
            btnLogin.textContent = 'Entrando...';
            errorMsg.style.display = 'none';
            attemptsWarning.style.display = 'none';

            try {
                const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);
                await signInWithEmailAndPassword(auth, email, password);
                
                localStorage.removeItem('login_attempts');
                window.location.href = '/admin/dashboard.html';
            } catch (error) {
                console.error(error);
                attempts++;
                localStorage.setItem('login_attempts', attempts);

                if (attempts >= 5) {
                    blockTime = Date.now() + 15 * 60 * 1000;
                    localStorage.setItem('login_block_time', blockTime);
                    checkBlock();
                } else {
                    attemptsWarning.textContent = `${5 - attempts} tentativas restantes`;
                    attemptsWarning.style.display = 'block';
                    
                    if (error.code === 'auth/invalid-credential') {
                        errorMsg.textContent = 'E-mail ou senha incorretos.';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMsg.textContent = 'Muitas tentativas. Aguarde antes de tentar novamente.';
                    } else {
                        errorMsg.textContent = 'Ocorreu um erro ao fazer login.';
                    }
                    errorMsg.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                }
            }
        });
    </script>
</body>
</html>
