<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Notícias - Manual BTC Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script>
        (function(){
            var t = localStorage.getItem('manualbtc-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .toolbar-filters {
            display: flex;
            gap: 0.5rem;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: var(--color-bg-card);
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            border: 1px solid var(--color-border);
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
        }
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .toast-success { background: #10b981; }
        .article-thumb {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-logo">
                <a href="dashboard.html">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 10c.83 0 1.5-.67 1.5-1.5v-1c0-.83-.67-1.5-1.5-1.5H11V10h3.5zm.5 2.5H11V15h4c.83 0 1.5-.67 1.5-1.5 0-.83-.67-1.5-1.5-1.5zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
                    Manual<strong>BTC</strong> <span class="sidebar-badge">Admin</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" data-page="dashboard">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Dashboard
                    </a></li>
                    <li><a href="nova-noticia.html" data-page="nova-noticia">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Nova Notícia
                    </a></li>
                    <li class="active"><a href="gerenciar.html" data-page="gerenciar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Gerenciar
                    </a></li>
                    <li><a href="newsletter.html" data-page="newsletter">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        Newsletter
                    </a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" target="_blank" class="sidebar-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Ver Site
                </a>
                <button class="btn-logout" id="btn-logout">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Sair
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-breadcrumb">Admin / Gerenciar Notícias</div>
            </header>

            <div class="admin-content">
                <div class="table-toolbar">
                    <h1 style="margin: 0;">Notícias</h1>
                    <div class="toolbar-filters">
                        <input type="text" id="search-input" class="field-input" placeholder="Buscar por título..." style="width: 200px;">
                        <select id="filter-status" class="field-input" style="width: 150px;">
                            <option value="">Status (Todos)</option>
                            <option value="published">Publicado</option>
                            <option value="draft">Rascunho</option>
                        </select>
                        <select id="filter-category" class="field-input" style="width: 150px;">
                            <option value="">Categoria (Todas)</option>
                            <option value="Fundamentos">Fundamentos</option>
                            <option value="Mineração">Mineração</option>
                            <option value="Economia">Economia</option>
                        </select>
                        <a href="nova-noticia.html" class="btn-admin-primary">Nova Notícia</a>
                    </div>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Capa</th>
                                <th style="cursor: pointer;" onclick="window.sortArticles('title')">Título</th>
                                <th style="cursor: pointer;" onclick="window.sortArticles('category')">Categoria</th>
                                <th>Status</th>
                                <th style="cursor: pointer;" onclick="window.sortArticles('publishDate')">Data</th>
                                <th>Tempo Leitura</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="articles-tbody">
                            <tr><td colspan="7" class="table-loading">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="admin-pagination" id="pagination" style="margin-top: 1rem; display: flex; justify-content: center; gap: 0.5rem;">
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Delete -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <h3 class="modal-title">Confirmar Exclusão</h3>
            <div class="modal-body">Esta ação é irreversível. Tem certeza que deseja excluir este artigo?</div>
            <div class="modal-footer">
                <button class="btn-admin-secondary" id="btn-cancel-delete">Cancelar</button>
                <button class="btn-danger" id="btn-confirm-delete" style="background:#dc2626;color:#fff;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;">Excluir Artigo</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { auth, db } from '../assets/js/firebase-config.js';
        import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { collection, onSnapshot, deleteDoc, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        let allArticles = [];
        let filteredArticles = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let deleteId = null;
        let currentSort = { field: 'publishDate', asc: false };

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '/admin/index.html';
            } else {
                subscribeToArticles();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = '/admin/index.html';
            });
        });

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-success`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function subscribeToArticles() {
            const q = query(collection(db, 'noticias'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                allArticles = [];
                snapshot.forEach((doc) => {
                    allArticles.push({ id: doc.id, ...doc.data() });
                });
                applyFilters();
            });
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('filter-status').value;
            const category = document.getElementById('filter-category').value;

            filteredArticles = allArticles.filter(a => {
                const matchSearch = (a.title || '').toLowerCase().includes(search);
                const matchStatus = status ? a.status === status : true;
                const matchCategory = category ? a.category === category : true;
                return matchSearch && matchStatus && matchCategory;
            });

            // Sort
            filteredArticles.sort((a, b) => {
                let valA = a[currentSort.field] || '';
                let valB = b[currentSort.field] || '';
                if(currentSort.field === 'publishDate') {
                    valA = new Date(valA).getTime();
                    valB = new Date(valB).getTime();
                }
                if(valA < valB) return currentSort.asc ? -1 : 1;
                if(valA > valB) return currentSort.asc ? 1 : -1;
                return 0;
            });

            currentPage = 1;
            renderTable();
        }

        window.sortArticles = (field) => {
            if(currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = true;
            }
            applyFilters();
        };

        function renderTable() {
            const tbody = document.getElementById('articles-tbody');
            tbody.innerHTML = '';

            if (filteredArticles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="table-empty" style="text-align:center;padding:2rem;">Nenhum artigo encontrado.</td></tr>';
                renderPagination(0);
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filteredArticles.slice(startIndex, endIndex);

            paginatedItems.forEach(item => {
                const date = item.publishDate ? new Date(item.publishDate).toLocaleDateString('pt-BR') : 'Sem data';
                const statusBadge = item.status === 'published' 
                    ? '<span class="badge-published" style="background:#10b98120;color:#10b981;padding:0.25rem 0.5rem;border-radius:4px;font-size:0.875rem;">Publicado</span>' 
                    : '<span class="badge-draft" style="background:#f59e0b20;color:#f59e0b;padding:0.25rem 0.5rem;border-radius:4px;font-size:0.875rem;">Rascunho</span>';
                const img = item.coverImage ? `<img src="${item.coverImage}" class="article-thumb" alt="Capa">` : '<div class="article-thumb" style="background:#333;"></div>';

                tbody.innerHTML += `
                    <tr>
                        <td>${img}</td>
                        <td><a href="nova-noticia.html?id=${item.id}" style="color:var(--color-text-primary);text-decoration:none;font-weight:500;">${item.title}</a></td>
                        <td>${item.category || '-'}</td>
                        <td>${statusBadge}</td>
                        <td>${date}</td>
                        <td>${item.readingTime || 0} min</td>
                        <td class="table-actions">
                            <a href="nova-noticia.html?id=${item.id}" class="btn-admin-secondary btn-sm">Editar</a>
                            <button class="btn-admin-secondary btn-sm" onclick="window.confirmDelete('${item.id}')" style="color:#dc2626;border-color:#dc2626;">Excluir</button>
                        </td>
                    </tr>
                `;
            });

            renderPagination(filteredArticles.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            
            if(totalPages <= 1) return;

            for(let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `btn-admin-secondary btn-sm ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                if(i === currentPage) {
                    btn.style.background = 'var(--color-accent)';
                    btn.style.color = '#000';
                }
                btn.onclick = () => {
                    currentPage = i;
                    renderTable();
                };
                container.appendChild(btn);
            }
        }

        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 300ms);
        });
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('filter-category').addEventListener('change', applyFilters);

        const modal = document.getElementById('delete-modal');
        window.confirmDelete = (id) => {
            deleteId = id;
            modal.style.display = 'flex';
        };
        document.getElementById('btn-cancel-delete').addEventListener('click', () => {
            deleteId = null;
            modal.style.display = 'none';
        });
        document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
            if(deleteId) {
                try {
                    await deleteDoc(doc(db, 'noticias', deleteId));
                    showToast('Artigo excluído com sucesso');
                } catch(e) {
                    console.error(e);
                    alert('Erro ao excluir artigo');
                }
                deleteId = null;
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
